name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "30 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed layers
    runs-on: ubuntu-26.04
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/codeql.yml'
            client:
              - 'client/**'
              - '.github/workflows/codeql.yml'

  analyze-server:
    name: Analyze (java-kotlin)
    needs: changes
    if: needs.changes.outputs.server == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: "liberica"
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Generate jOOQ sources before tracing
        working-directory: server
        run: |
          ./gradlew jooqCodegen --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" \
            -Dkotlin.compiler.execution.strategy=in-process

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build server
        working-directory: server
        run: |
          ./gradlew testClasses --no-daemon --no-build-cache \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" \
            -Dkotlin.compiler.execution.strategy=in-process

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  analyze-client:
    name: Analyze (javascript-typescript)
    needs: changes
    if: needs.changes.outputs.client == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
