name: Deploy to Railway

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  check-release:
    name: Check release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      is-prerelease: ${{ steps.release.outputs.is-prerelease }}
    steps:
      - name: Resolve release prerelease flag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          is_prerelease=$(gh release view "${{ github.event.workflow_run.head_branch }}" \
            --repo "${{ github.repository }}" --json isPrerelease --jq .isPrerelease)
          echo "is-prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

  deploy-server:
    name: Deploy server
    runs-on: ubuntu-latest
    needs: check-release
    if: needs.check-release.outputs.is-prerelease == 'false'
    steps:
      - name: Install Railway CLI
        run: curl -fsSL https://railway.com/install.sh | sh

      - name: Redeploy investlog-server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway redeploy --service investlog-server --environment production --from-source --yes

  deploy-client:
    name: Deploy client
    runs-on: ubuntu-latest
    needs: check-release
    if: needs.check-release.outputs.is-prerelease == 'false'
    steps:
      - name: Install Railway CLI
        run: curl -fsSL https://railway.com/install.sh | sh

      - name: Redeploy investlog-client
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway redeploy --service investlog-client --environment production --from-source --yes
