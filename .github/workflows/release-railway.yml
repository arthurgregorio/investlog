name: Deploy to Railway

on:
  workflow_run:
    workflows: [ "Release" ]
    types: [ completed ]

jobs:
  check-release:
    name: Check release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      is-prerelease: ${{ steps.release.outputs.is-prerelease }}
    steps:
      - name: Resolve release prerelease flag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          is_prerelease=$(gh release view "${{ github.event.workflow_run.head_branch }}" \
            --repo "${{ github.repository }}" --json isPrerelease --jq .isPrerelease)
          echo "is-prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

  deploy-server:
    name: Deploy server
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    needs: check-release
    if: needs.check-release.outputs.is-prerelease == 'false'
    steps:
      - name: Redeploy investlog-server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway redeploy --service investlog-server --environment production --yes

      - name: Wait for investlog-server deployment to succeed
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          apk add --no-cache jq
          for i in $(seq 1 60); do
            status=$(railway deployment list --service investlog-server --environment production --json | jq -r '.[0].status')
            echo "status: $status"
            [ "$status" = "SUCCESS" ] && exit 0
            if [ "$status" = "FAILED" ] || [ "$status" = "CRASHED" ]; then exit 1; fi
            sleep 10
          done
          echo "timed out waiting for investlog-server deployment"
          exit 1

  deploy-client:
    name: Deploy client
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    needs: [ check-release, deploy-server ]
    if: needs.check-release.outputs.is-prerelease == 'false'
    steps:
      - name: Redeploy investlog-client
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway redeploy --service investlog-client --environment production --yes
