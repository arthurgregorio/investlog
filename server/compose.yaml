name: investlog

services:

  postgres:
    container_name: investlog-postgres
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=sa_investlog'
      - 'POSTGRES_PASSWORD=sa_investlog'
      - 'POSTGRES_USER=sa_investlog'
    ports:
      - '5433'
    volumes:
      - data-postgres:/var/lib/postgresql/data
    networks:
      - default

volumes:
  data-postgres:
    driver: local

networks:
  default:
    driver: bridge