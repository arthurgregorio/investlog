name: investlog

services:

  postgres:
    container_name: investlog-postgres
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=sa_investlog'
      - 'POSTGRES_PASSWORD=sa_investlog'
      - 'POSTGRES_USER=sa_investlog'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/docker
    networks:
      - default

volumes:
  postgres-data:
    driver: local

networks:
  default:
    driver: bridge