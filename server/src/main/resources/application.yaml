spring:
  application:
    name: server

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    database-change-log-table: database_changelog
    database-change-log-lock-table: database_changelog_lock

server:
  servlet:
    session:
      cookie:
        same-site: lax

logging:
  level:
    org.jooq.Constants: off

# FIXME we should make this structure better
investlog:
  admin-default-password: ${ADMIN_DEFAULT_PASSWORD:admin}
  totp-required: ${TOTP_REQUIRED:true}
  totp-lockout:
    max-attempts: ${TOTP_LOCKOUT_MAX_ATTEMPTS:5}
    base-duration: ${TOTP_LOCKOUT_BASE_DURATION:60s}
  google-auth-enabled: ${GOOGLE_AUTH_ENABLED:false}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  client-base-url: ${CLIENT_BASE_URL:http://localhost:8081}
  brapi:
    base-url: https://brapi.dev/api
    token: ${BRAPI_TOKEN:}
