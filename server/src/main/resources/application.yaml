spring:
  application:
    name: server

  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    database-change-log-table: database_changelog
    database-change-log-lock-table: database_changelog_lock

server:
  servlet:
    session:
      cookie:
        same-site: lax

logging:
  level:
    org.jooq.Constants: off
    com.openhtmltopdf: warn

investlog:
  demo-mode:
    enabled: false

  security:
    admin-default-password: ${ADMIN_DEFAULT_PASSWORD:admin}
    totp:
      enabled: ${TOTP_REQUIRED:true}
      lockout-max-attempts: ${TOTP_LOCKOUT_MAX_ATTEMPTS:5}
      lockout-base-duration: ${TOTP_LOCKOUT_BASE_DURATION:60s}
    login:
      lockout-max-attempts: ${LOGIN_LOCKOUT_MAX_ATTEMPTS:5}
      lockout-base-duration: ${LOGIN_LOCKOUT_BASE_DURATION:60s}
    trusted-device:
      expiry: ${TRUSTED_DEVICE_EXPIRY:30d}
    ip-lockout:
      max-attempts: ${IP_LOCKOUT_MAX_ATTEMPTS:20}
      base-duration: ${IP_LOCKOUT_BASE_DURATION:60s}
      failure-window: ${IP_LOCKOUT_FAILURE_WINDOW:15m}
    registration-limit:
      max-attempts: ${REGISTRATION_LIMIT_MAX_ATTEMPTS:10}
      base-duration: ${REGISTRATION_LIMIT_BASE_DURATION:15m}
      failure-window: ${REGISTRATION_LIMIT_FAILURE_WINDOW:1h}
    client-ip:
      trusted-proxy-count: ${CLIENT_IP_TRUSTED_PROXY_COUNT:0}

  google-auth:
    enabled: ${GOOGLE_AUTH_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    client-base-url: ${CLIENT_BASE_URL:http://localhost:8081}

  brapi:
    base-url: https://brapi.dev/api
    token: ${BRAPI_TOKEN:}
    connect-timeout: ${BRAPI_CONNECT_TIMEOUT:5s}
    read-timeout: ${BRAPI_READ_TIMEOUT:15s}

  coingecko:
    base-url: ${COINGECKO_BASE_URL:https://api.coingecko.com/api/v3}
    api-key: ${COINGECKO_KEY:}
    api-key-header: ${COINGECKO_API_KEY_HEADER:x-cg-demo-api-key}
    connect-timeout: ${COINGECKO_CONNECT_TIMEOUT:5s}
    read-timeout: ${COINGECKO_READ_TIMEOUT:15s}

  awesomeapi:
    base-url: https://economia.awesomeapi.com.br
    connect-timeout: ${AWESOMEAPI_CONNECT_TIMEOUT:5s}
    read-timeout: ${AWESOMEAPI_READ_TIMEOUT:15s}

  mail:
    encryption-key: ${MAIL_ENCRYPTION_KEY:}
