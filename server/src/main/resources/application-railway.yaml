spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

server:
  # Railway's private network (*.railway.internal) is IPv6-only; without an explicit
  # dual-stack bind, sibling services can't reach this service even though it's healthy
  # locally (public healthcheck traffic takes a different path and still succeeds).
  address: '::'
  forward-headers-strategy: framework

investlog:
  demo-mode:
    enabled: true

  security:
    totp:
      enabled: false
