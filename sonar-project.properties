sonar.projectKey=arthurgregorio_investlog
sonar.organization=arthurgregorio
sonar.host.url=https://sonarcloud.io

# Test code is intentionally excluded from analysis: fixture credentials (e.g. the seeded
# local admin), repeated JSON request bodies, and repeated assertion literals are expected in
# tests and don't reflect real production security/maintainability/reliability risk.
#
# node_modules/dist/build are generated/vendored output, not source we own.
sonar.exclusions=server/src/test/**,client/src/**/*.spec.ts,client/node_modules/**,client/dist/**,server/build/**,server/.gradle/**
